# 1. Give your workflow a name. This appears in the 'Actions' tab of your repository.
name: My First Workflow

# 2. When should this workflow run? This is the "trigger."
on:
  push:
    # Only run when code is pushed to the 'main' branch
    branches:
      - main

# 3. What "jobs" should this workflow do? A workflow can have one or more jobs.
jobs:
  # This is the ID of our first job. You can call it anything unique.
  greet-the-world:
    # 4. On what kind of computer (runner) should this job run?
    # 'ubuntu-latest' is a common choice for Linux.
    runs-on: ubuntu-latest

    # 5. What "steps" should this job take? Steps are executed in order.
    steps:
      # Step 1: Give your step a name.
      - name: Say Hello
        # 'run' tells GitHub to execute a command on the runner.
        run: echo "Hello, GitHub Actions World!"

      # Step 2: Another step. This one checks out your code.
      # You often need this if your workflow needs to interact with your repository's files.
      - name: Check out repository code
        # 'uses' tells GitHub to use a pre-built "action" from the GitHub Marketplace or another repository.
        # 'actions/checkout@v4' is a common action to get your code onto the runner.
        uses: actions/checkout@v4

      # Step 3: Let's list the files to show the code was checked out.
      - name: List files in the repository
        run: |
          echo "Files in the repository:"
          ls -F
